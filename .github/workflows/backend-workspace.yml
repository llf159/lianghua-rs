name: backend-workspace

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "analysis_tools/**"
      - "ui/lianghua_web/**"
      - ".github/workflows/backend-workspace.yml"
  push:
    branches:
      - main
      - "refactor/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "analysis_tools/**"
      - "ui/lianghua_web/**"
      - ".github/workflows/backend-workspace.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: backend-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check all backend targets
        run: cargo check --all-targets

      - name: Test dependency-free layers
        run: cargo test --package lianghua-core --package lianghua-provider --package lianghua-model

      - name: Setup DuckDB for data regression tests
        run: |
          mkdir -p "$RUNNER_TEMP/duckdb"
          curl --fail --location --retry 3 https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-shared-libs-linux-amd64.tar.gz -o "$RUNNER_TEMP/duckdb.tar.gz"
          tar -xzf "$RUNNER_TEMP/duckdb.tar.gz" -C "$RUNNER_TEMP/duckdb"
          echo "DUCKDB_LIB_DIR=$RUNNER_TEMP/duckdb" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/duckdb" >> "$GITHUB_ENV"

      - name: Test chip rebuild state and strategy maintenance
        run: |
          cargo test --package lianghua-data chip_rebuild_completion_preserves_partial_and_other_model_debts
          cargo test --package lianghua-data maintain_cyq_chen_incremental_rebuilds_all_when_strategy_changes

      - name: Test monitor daily baselines and pause behavior
        run: |
          cargo test --package lianghua-app-market daily_baseline::tests
          cargo test --package lianghua-app-market volume_ratio::tests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/lianghua_web/package-lock.json

      - name: Check frontend build
        working-directory: ui/lianghua_web
        run: |
          npm ci
          npm run build
