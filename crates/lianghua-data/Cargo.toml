[package]
name = "lianghua-data"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
lianghua-core = { path = "../lianghua-core" }
lianghua-provider = { path = "../lianghua-provider" }
lianghua-model = { path = "../lianghua-model" }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.8"
duckdb = { version = "~1.20000.0", features = ["appender-arrow"] }
rayon = "1.12.0"
csv = "1.4.0"
chrono = "0.4.45"
rand = "0.9.5"

serde_json = { version = "1.0.149", features = ["float_roundtrip"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
