[package]
name = "lianghua-app-market"
version = "0.1.0"
edition = "2024"

[dependencies]
lianghua-app-expression = { path = "../lianghua-app-expression" }
lianghua-app-shared = { path = "../lianghua-app-shared" }
lianghua-core = { path = "../lianghua-core" }
lianghua-data = { path = "../lianghua-data" }
lianghua-download = { path = "../lianghua-download" }
lianghua-provider = { path = "../lianghua-provider" }
lianghua-scoring = { path = "../lianghua-scoring" }
chrono = "0.4.45"
duckdb = { version = "~1.20000.0", features = ["appender-arrow"] }
rayon = "1.12.0"
reqwest = { version = "0.13.5", features = ["blocking", "json", "query"] }
serde = { version = "1.0", features = ["derive"] }
bincode = { package = "bincode-next", version = "3.1.1", features = ["serde"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
