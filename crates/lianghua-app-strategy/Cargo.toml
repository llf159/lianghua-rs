[package]
name = "lianghua-app-strategy"
version = "0.1.0"
edition = "2024"

[dependencies]
lianghua-app-shared = { path = "../lianghua-app-shared" }
lianghua-backtest = { path = "../lianghua-backtest" }
lianghua-core = { path = "../lianghua-core" }
lianghua-data = { path = "../lianghua-data" }
lianghua-download = { path = "../lianghua-download" }
lianghua-model = { path = "../lianghua-model" }
lianghua-scoring = { path = "../lianghua-scoring" }
chrono = "0.4.45"
csv = "1.4.0"
duckdb = { version = "~1.20000.0", features = ["appender-arrow"] }
rand = "0.9.5"
rayon = "1.12.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
sha2 = "0.10.9"
toml = "1.1.8"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
