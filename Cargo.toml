[package]
name = "lianghua-rs"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = [
    ".",
    "crates/lianghua-core",
    "crates/lianghua-provider",
    "crates/lianghua-model",
    "crates/lianghua-data",
    "crates/lianghua-download",
    "crates/lianghua-scoring",
    "crates/lianghua-backtest",
    "crates/lianghua-app-shared",
    "crates/lianghua-app-chart",
    "crates/lianghua-app-expression",
    "crates/lianghua-app-data",
    "crates/lianghua-app-market",
    "crates/lianghua-app-strategy",
    "crates/lianghua-app-facade",
    "ui/lianghua_web/src-tauri",
]
default-members = [
    ".",
    "crates/lianghua-core",
    "crates/lianghua-provider",
    "crates/lianghua-model",
    "crates/lianghua-data",
    "crates/lianghua-download",
    "crates/lianghua-scoring",
    "crates/lianghua-backtest",
    "crates/lianghua-app-shared",
    "crates/lianghua-app-chart",
    "crates/lianghua-app-expression",
    "crates/lianghua-app-data",
    "crates/lianghua-app-market",
    "crates/lianghua-app-strategy",
    "crates/lianghua-app-facade",
]

[dependencies]
lianghua-backtest = { path = "crates/lianghua-backtest" }
lianghua-data = { path = "crates/lianghua-data" }
lianghua-model = { path = "crates/lianghua-model" }
duckdb = { version = "1.4.4", features = ["appender-arrow"] }

# Keep compute-heavy backend crates optimized during Tauri development builds.
[profile.dev.package.lianghua-data]
opt-level = 3

[profile.dev.package.lianghua-download]
opt-level = 3

[profile.dev.package.lianghua-scoring]
opt-level = 3

[profile.dev.package.lianghua-backtest]
opt-level = 3
