[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
lianghua-backtest = { path = "../../../crates/lianghua-backtest" }
lianghua-app-chart = { path = "../../../crates/lianghua-app-chart" }
lianghua-app-data = { path = "../../../crates/lianghua-app-data" }
lianghua-app-expression = { path = "../../../crates/lianghua-app-expression" }
lianghua-app-facade = { path = "../../../crates/lianghua-app-facade" }
lianghua-app-market = { path = "../../../crates/lianghua-app-market" }
lianghua-app-strategy = { path = "../../../crates/lianghua-app-strategy" }
lianghua-data = { path = "../../../crates/lianghua-data" }
lianghua-download = { path = "../../../crates/lianghua-download" }
lianghua-provider = { path = "../../../crates/lianghua-provider" }

serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = "0.4.45"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2.10.1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-notification = "2.7.0"
tokio = { version = "1.0", features = ["process", "macros", "time"] }
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
duckdb = { version = "~1.20000.0", features = ["appender-arrow"] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
duckdb = { version = "~1.20000.0", features = ["bundled", "appender-arrow", "parquet"] }

[target.'cfg(target_os = "android")'.dependencies]
duckdb = { version = "~1.20000.0", features = ["bundled", "appender-arrow", "parquet"] }
libc = "0.2"
jni = "0.21.1"
jni-sys = "=0.3.0"
rustls-platform-verifier = "=0.6.2"
