# S6 inventory memory, medium strength. Requires chip engine version 2.
# Buy bias is signed direction evidence; sell bias retains the version 1 semantics.
version = 2

[[strategy]]
name = "main基础sell"
holder = "main"
direction = "sell"
when = "C > 0"
bias = 1.0
confirm_after = 0


[[strategy]]
name = "P01_放量急跌破位_main_buy"
holder = "main"
direction = "buy"
when = "(C < REF(LLV(L,20),1) AND TOR >= REF(MA(TOR,20),1) AND C / REF(C,1)-1 < -2*REF(MA(ABS(C/REF(C,1)-1),20),1))"
bias = -0.08
confirm_after = 0


[[strategy]]
name = "P01_放量急跌破位_main_sell"
holder = "main"
direction = "sell"
when = "(C < REF(LLV(L,20),1) AND TOR >= REF(MA(TOR,20),1) AND C / REF(C,1)-1 < -2*REF(MA(ABS(C/REF(C,1)-1),20),1))"
bias = 0.7
confirm_after = 0


[[strategy]]
name = "P02_突破失败_main_buy"
holder = "main"
direction = "buy"
when = "(REF(C,3) > REF(HHV(H,20),4) AND C < REF(HHV(H,20),4)*0.97)"
bias = -0.06
confirm_after = 0


