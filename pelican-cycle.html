<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3e8">
  <title>鹈鹕的海岸骑行 · Pelican on wheels</title>
  <style>
    :root { color-scheme: light; --paper: #f7f3e8; --ink: #264c49; --muted: #798a7b; --sky: #e6eee7; --sea: #b9d8ce; --sea-deep: #91bfb4; --sun: #eec879; --accent: #d97752; --sand: #e8ddc2; --line: #d9ddcf; --duration: 1s; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", sans-serif; transition: background 1s, color 1s; }
    body.sunset { --paper: #f5e9df; --sky: #f0d7c6; --sea: #b7c9c2; --sea-deep: #94b1ab; --sun: #e99b70; --sand: #e9cdb4; --line: #dfcec1; }
    main { max-width: 1240px; margin: auto; padding: 30px 44px 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 23px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .12em; }
    .brand svg { width: 30px; height: 30px; }
    .edition { color: var(--muted); font: 11px ui-monospace, monospace; letter-spacing: .12em; }
    .intro { text-align: center; padding: 43px 0 14px; }
    .eyebrow { color: var(--accent); font: 11px ui-monospace, monospace; letter-spacing: .24em; }
    h1 { margin: 16px 0 13px; font-family: "Songti SC", "Noto Serif CJK SC", serif; font-weight: 500; font-size: clamp(32px, 4.2vw, 53px); letter-spacing: .08em; }
    .intro p { color: var(--muted); margin: 0; font-size: 13px; line-height: 1.9; letter-spacing: .09em; }
    .scene { position: relative; margin: 14px 0 0; }
    .scene > svg { display: block; width: 100%; height: auto; overflow: visible; }
    svg .sky { fill: var(--sky); transition: fill 1s; }
    svg .sea { fill: var(--sea); transition: fill 1s; }
    svg .sea-deep { fill: var(--sea-deep); transition: fill 1s; }
    svg .sun { fill: var(--sun); transition: fill 1s; }
    svg .sand { fill: var(--sand); transition: fill 1s; }
    .cloud { animation: clouds 22s linear infinite; }
    .cloud.second { animation-duration: 31s; animation-delay: -11s; }
    .road-dashes { animation: road calc(var(--duration) * 1.4) linear infinite; }
    .sea-glints { animation: shimmer 4s ease-in-out infinite alternate; }
    .scarf-tail { transform-origin: 475px 260px; animation: flutter calc(var(--duration) * .65) ease-in-out infinite alternate; }
    .wing { transform-origin: 508px 315px; animation: wing calc(var(--duration) * 1.2) ease-in-out infinite alternate; }
    .blink { transform-origin: 639px 192px; animation: blink 5.7s infinite; }
    .gull { animation: soar 7s ease-in-out infinite alternate; }
    .gull.second { animation-delay: -3s; animation-duration: 9s; }
    .grass { transform-box: fill-box; transform-origin: bottom; animation: sway 2.6s ease-in-out infinite alternate; }
    .paused *, .paused *::before, .paused *::after { animation-play-state: paused !important; }
    @keyframes clouds { from { transform: translateX(-35px); } to { transform: translateX(70px); } }
    @keyframes road { from { transform: translateX(0); } to { transform: translateX(-180px); } }
    @keyframes shimmer { from { opacity: .35; } to { opacity: .85; } }
    @keyframes flutter { from { transform: rotate(-6deg) scaleY(.85); } to { transform: rotate(7deg) scaleY(1.08); } }
    @keyframes wing { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    @keyframes blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 45% { transform: scaleY(.08); } }
    @keyframes soar { from { transform: translate(0, 0) rotate(-3deg); } to { transform: translate(25px, -10px) rotate(3deg); } }
    @keyframes sway { from { transform: skewX(-5deg); } to { transform: skewX(7deg); } }
    .controls { display: flex; justify-content: center; align-items: center; gap: 26px; margin: 13px auto 35px; flex-wrap: wrap; }
    button { cursor: pointer; font: inherit; -webkit-tap-highlight-color: transparent; }
    .play { display: flex; align-items: center; justify-content: center; gap: 9px; min-width: 132px; padding: 12px 19px; border-radius: 30px; background: var(--ink); color: var(--paper); border: 1px solid var(--ink); font-size: 12px; }
    .play:hover { background: #37635d; }
    .play svg { width: 13px; height: 13px; fill: currentColor; }
    .speed { display: flex; align-items: center; gap: 11px; font-size: 11px; color: var(--muted); }
    input[type="range"] { width: 110px; height: 4px; accent-color: var(--ink); cursor: pointer; }
    output { font: 11px ui-monospace, monospace; width: 32px; color: var(--ink); }
    .mode { display: flex; align-items: center; gap: 7px; background: none; border: none; padding: 10px 0; color: var(--ink); font-size: 11px; }
    .mode svg { width: 17px; height: 17px; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    footer { display: flex; justify-content: space-between; gap: 15px; border-top: 1px solid var(--line); padding-top: 18px; color: var(--muted); font-size: 10px; letter-spacing: .09em; line-height: 1.8; }
    .live-dot { display: inline-block; width: 5px; height: 5px; margin-right: 7px; border-radius: 50%; background: var(--accent); vertical-align: 2px; }
    @media (max-width: 600px) { main { padding: 20px 18px; } .edition { font-size: 9px; } .brand { font-size: 11px; } .intro { padding-top: 34px; } .intro p { font-size: 11px; } .scene { margin: 28px -13px 12px; } .controls { gap: 16px; margin-bottom: 28px; } .speed { gap: 7px; } input[type="range"] { width: 80px; } .mode { font-size: 10px; } footer { font-size: 9px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="14" stroke="currentColor"/><path d="M7 20q5-7 11 0M16 12q1-6 5-4l5 3h-7v9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21" cy="9" r=".8" fill="currentColor"/></svg>慢慢骑行俱乐部</div>
      <span class="edition">COASTAL TALES / NO. 001</span>
    </header>
    <section class="intro">
      <span class="eyebrow">A LITTLE RIDE, A LITTLE JOY</span>
      <h1>把日子，骑成海风。</h1>
      <p>一只鹈鹕，一辆单车。今天的目的地，是好心情。</p>
    </section>
    <figure class="scene" aria-label="一只戴着绿色帽子、围着橙色围巾的鹈鹕，沿海岸踩着薄荷绿自行车前行。">

          <g fill="none" stroke="#8b9e79" stroke-width="3" stroke-linecap="round"><path class="grass" d="M114 503q-3-25-16-34m16 34q3-30 16-39m-16 39q-18-16-27-14"/><path class="grass" d="M977 490q-2-28-15-40m15 40q2-22 17-31m-17 31q16-12 24-9"/></g>
          <g fill="#c5ad88"><ellipse cx="240" cy="515" rx="7" ry="2"/><ellipse cx="874" cy="500" rx="9" ry="2.5"/><ellipse cx="925" cy="536" rx="5" ry="2"/></g>

          <g stroke="#eadfbe" stroke-width="3"><circle cx="415" cy="545" r="93"/><circle cx="735" cy="545" r="93"/></g>
          <g transform="translate(415 545)"><g id="back-wheel"><use href="#spokes"/></g></g>
          <g transform="translate(735 545)"><g id="front-wheel"><use href="#spokes"/></g></g>
          <path d="M415 545L480 418L565 535ZM480 418L658 411L565 535M658 411L735 545" stroke="#35685e" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M415 545L480 418L565 535M480 418L658 411L565 535M658 411L735 545" stroke="#80b9a1" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M644 387L735 545" stroke="#35685e" stroke-width="8" stroke-linecap="round"/>
          <path d="M644 387L635 367Q630 357 644 353L680 349" stroke="#53645a" stroke-width="7" stroke-linecap="round"/>
          <path d="M675 349l21-3" stroke="#b78454" stroke-width="11" stroke-linecap="round"/>
          <path d="M480 418l-8-31" stroke="#607b6d" stroke-width="7"/>
          <path d="M448 386q22-4 52 0" stroke="#705741" stroke-width="14" stroke-linecap="round"/>
          <path d="M415 537L562 516Q585 516 585 535Q585 555 563 554L415 552Z" stroke="#667b64" stroke-width="2.5"/>
          <circle cx="565" cy="535" r="23" fill="#c8cfaf" stroke="#526e58" stroke-width="3"/>
          <circle cx="565" cy="535" r="15" stroke="#84967b" stroke-width="2" stroke-dasharray="3 5"/>
        </g>
        <g fill="#47695b"><circle cx="415" cy="545" r="7"/><circle cx="735" cy="545" r="7"/></g>

        <g id="pelican">
          <g class="scarf-tail" fill="#d87951" stroke="#b96343" stroke-width="1.5"><path d="M555 264Q507 244 451 267L423 253L429 278Q492 291 555 276Z"/><path d="M543 271Q508 277 477 308L453 306L464 321Q515 305 555 281Z"/></g>
          <!-- A broad body, long neck and oversized throat pouch make the bird a pelican. -->
          <path d="M459 340L403 325L425 358L397 358Q430 388 469 368Z" fill="#e2e6d5" stroke="#46685b" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M451 296Q471 265 523 274Q552 279 569 280Q578 253 587 217Q594 182 625 178Q654 176 663 199Q666 221 649 237Q624 250 627 287Q632 330 592 359Q555 396 489 381Q442 370 438 342Q432 318 451 296Z" fill="#fffbee" stroke="#46685b" stroke-width="3"/>
          <path d="M597 236Q583 296 607 310Q614 328 585 350Q545 380 481 365Q527 394 575 371Q638 344 627 287Q624 251 649 237Z" fill="#e6e8d8"/>
          <g class="wing"><path d="M474 305Q505 285 552 308L592 337Q548 365 503 348Q481 337 474 305Z" fill="#e7e9d9" stroke="#7b9380" stroke-width="2"/><path d="M496 317Q528 340 569 335M490 327Q518 350 552 346" fill="none" stroke="#b6c2a9" stroke-width="2" stroke-linecap="round"/></g>
          <path d="M578 258Q598 272 625 261L625 279Q596 290 573 276Z" fill="#d87951" stroke="#b96343" stroke-width="1.5"/>
          <path d="M582 262l-4 11m14-8-3 12m14-10-2 12" stroke="#f5b27c" stroke-width="3"/>
          <path d="M652 211L812 223Q799 258 747 263Q695 267 652 224Z" fill="#edbb6d" stroke="#a87d45" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M653 211L812 223L655 230" fill="#f4ce82" stroke="#a87d45" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M661 233Q710 255 769 245" fill="none" stroke="#dca65e" stroke-width="2" stroke-linecap="round"/>
          <path d="M804 223l12 0-7 8" fill="#b37d48"/>
          <circle cx="638" cy="193" r="10" fill="#eae8cd"/>
          <g class="blink"><circle cx="639" cy="192" r="4.4" fill="#284d45"/><circle cx="640.2" cy="190.6" r="1.2" fill="#fff"/></g>
          <path d="M629 179q9-5 16-1" fill="none" stroke="#698171" stroke-width="2" stroke-linecap="round"/>
          <path d="M591 180Q594 148 621 149Q645 151 650 178Z" fill="#507b63" stroke="#355e4b" stroke-width="2.5"/>

        <path id="near-leg" d="M524 356L584 432L602 535" fill="none" stroke="#e7ad60" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

        </g>
        <g fill="none" stroke="#819783" stroke-width="2" stroke-linecap="round" opacity=".55"><path d="M367 313h-30m14 12h-31M393 294h-20"/></g>

    <div class="controls" aria-label="动画控制">
      <button class="play" id="play" type="button" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="play-icon" d="M4 2h3v12H4zm5 0h3v12H9z"/></svg><span id="play-label">暂停旅程</span></button>
      <label class="speed" for="speed">骑行速度 <input id="speed" type="range" min="0.4" max="2" step="0.1" value="1"><output id="speed-label" for="speed">1.0×</output></label>
      <button class="mode" id="mode" type="button" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2 13h16M4 16h12M6 10a4 4 0 0 1 8 0M10 1v3M3 4l2 2m12-2-2 2" stroke-linecap="round"/></svg><span id="mode-label">切换日落</span></button>
    </div>
    <footer><span><i class="live-dot"></i>海风正好，慢一点也没关系。</span><span>MADE OF SVG & A LITTLE DAYDREAM</span></footer>
  </main>
  <script>
    let paused = false;
    let speed = 1;
    let phase = 0;
    let previousTime;
    let playButton = document.getElementById('play');
    let speedInput = document.getElementById('speed');
    let modeButton = document.getElementById('mode');
    let backWheel = document.getElementById('back-wheel');
    let frontWheel = document.getElementById('front-wheel');
    let crank = document.getElementById('crank');
    let pelican = document.getElementById('pelican');
    let limbs = ['far', 'near'].map(side => ({
      leg: document.getElementById(side + '-leg'),
      foot: document.getElementById(side + '-foot'),
      pedal: document.getElementById(side + '-pedal')
    }));

    playButton.addEventListener('click', () => {
      paused = !paused;
      document.body.classList.toggle('paused', paused);
      playButton.setAttribute('aria-pressed', String(paused));
      document.getElementById('play-label').textContent = paused ? '继续骑行' : '暂停旅程';
      document.getElementById('play-icon').setAttribute('d', paused ? 'M4 2l10 6-10 6z' : 'M4 2h3v12H4zm5 0h3v12H9z');
    });
    speedInput.addEventListener('input', () => {
      speed = Number(speedInput.value);
      document.getElementById('speed-label').value = speed.toFixed(1) + '×';
      document.documentElement.style.setProperty('--duration', (1 / speed) + 's');
    });
    modeButton.addEventListener('click', () => {
      let sunset = document.body.classList.toggle('sunset');
      modeButton.setAttribute('aria-pressed', String(sunset));
      document.getElementById('mode-label').textContent = sunset ? '切换晴天' : '切换日落';
      document.querySelector('meta[name="theme-color"]').content = sunset ? '#f5e9df' : '#f7f3e8';
    });

    function animate(time) {
      let elapsed = previousTime === undefined ? 0 : Math.min((time - previousTime) / 1000, .05);
      previousTime = time;
      if (!paused) {
        phase = (phase + elapsed * speed * 4.2) % (Math.PI * 2);
        let degrees = phase * 180 / Math.PI;
        let bob = Math.sin(phase * 2) * 2;
        backWheel.setAttribute('transform', 'rotate(' + degrees + ')');
        frontWheel.setAttribute('transform', 'rotate(' + degrees + ')');
        crank.setAttribute('transform', 'rotate(' + degrees + ' 565 535)');
        pelican.setAttribute('transform', 'translate(0 ' + bob + ')');
        // Solve each knee from fixed thigh/shin lengths, so the feet stay on the pedals.
        limbs.forEach((limb, index) => {
          let angle = phase + (index === 0 ? Math.PI : 0);
          let footX = 565 + Math.cos(angle) * 37;
          let footY = 535 + Math.sin(angle) * 37;
          let hipX = index === 0 ? 516 : 530;
          let hipY = 364 + bob;
          let deltaX = footX - hipX;
          let deltaY = footY - hipY;
          let distance = Math.hypot(deltaX, deltaY);
          let along = (108 * 108 - 112 * 112 + distance * distance) / (2 * distance);
          let outward = Math.sqrt(Math.max(0, 108 * 108 - along * along));
          let kneeX = hipX + deltaX * along / distance + deltaY * outward / distance;
          let kneeY = hipY + deltaY * along / distance - deltaX * outward / distance;
          limb.leg.setAttribute('d', `M${hipX} ${hipY}L${kneeX} ${kneeY}L${footX} ${footY}`);
          limb.foot.setAttribute('d', `M${footX - 8} ${footY}Q${footX + 6} ${footY - 2} ${footX + 19} ${footY + 2}`);
          limb.pedal.setAttribute('x', footX - 12);
          limb.pedal.setAttribute('y', footY + 5);
        });
      }
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
